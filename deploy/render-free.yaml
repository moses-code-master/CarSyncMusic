# Trial only: no persistent disk. Sessions and audio can be lost on restart/deploy.
# Select this file as the Blueprint path if you explicitly choose the free trial.
services:
  - type: web
    name: carsync-music
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: DATA_DIR
        value: /app/data
