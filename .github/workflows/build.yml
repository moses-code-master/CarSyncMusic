name: Test server and build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  android:
    runs-on: ubuntu-latest
    env:
      CARSYNC_KEYSTORE: /tmp/carsync-test.jks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Restore persistent test signing key
        env:
          KEYSTORE_B64: ${{ secrets.CARSYNC_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then printf '%s' "$KEYSTORE_B64" | base64 -d > "$CARSYNC_KEYSTORE"; fi
      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK and run clock tests
        working-directory: android
        run: sh gradlew assembleRelease testDebugUnitTest lintRelease --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: CarSyncMusic-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-results
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  playback-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARSYNC_KEYSTORE: /tmp/carsync-test.jks
    strategy:
      fail-fast: false
      matrix:
        api: [23, 26, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore persistent test signing key
        env:
          KEYSTORE_B64: ${{ secrets.CARSYNC_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then printf '%s' "$KEYSTORE_B64" | base64 -d > "$CARSYNC_KEYSTORE"; fi
      - name: Start isolated test music server
        run: |
          npm ci --prefix backend
          DATA_DIR=/tmp/carsync-test node backend/src/server.mjs > /tmp/carsync-server.log 2>&1 &
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fetch previous APK for update compatibility check
        run: curl --fail --location --retry 2 https://github.com/moses-code-master/CarSyncMusic/releases/download/v1.3.1/CarSyncMusic.apk --output /tmp/carsync-previous.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: android
          script: sh ../.github/scripts/runtime-check.sh
      - name: Collect device diagnostics and screen captures
        if: always()
        run: |
          mkdir -p runtime-results
          cp /tmp/carsync-server.log runtime-results/server.log || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playback-runtime-api-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
            runtime-results


